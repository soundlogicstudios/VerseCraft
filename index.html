<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Backrooms Branching</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <main class="app">

    <!-- BACKGROUND -->
    <div class="app-background"></div>

    <section class="stage">

      <!-- VIDEO -->
      <video id="video" class="video" playsinline preload="metadata"></video>

      <!-- DIMMER -->
      <div id="dimmer" class="dimmer"></div>

      <!-- FRAME OVERLAY -->
      <img
        src="assets/ui/frames/video_frame_overlay.webp"
        class="frame-overlay"
        alt=""
        aria-hidden="true"
      />

      <!-- TAP BUTTON -->
      <button id="tapToPlay" class="tap-to-play">TAP TO PLAY</button>

      <!-- CHOICES -->
      <div id="choices" class="choices hidden"></div>

      <!-- MODAL -->
      <div id="modalBackdrop" class="modal-backdrop hidden">
        <div class="modal-panel">
          <div id="modalContent"></div>
          <button id="modalClose" class="modal-close">Close</button>
        </div>
      </div>

      <!-- STATUS DEBUG -->
      <div id="status" class="status"></div>

    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
