<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Backrooms Branching</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <main class="app">

    <!-- VIDEO STAGE (under intro) -->
    <section class="stage" aria-label="Video Stage">
      <video id="video" class="video" playsinline preload="metadata"></video>

      <div id="dimmer" class="dimmer" aria-hidden="true"></div>

      <img
        src="assets/ui/frames/video_frame_overlay.webp"
        class="frame-overlay"
        alt=""
        aria-hidden="true"
      />

      <div id="choices" class="choices hidden" aria-label="Choices"></div>
      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <!-- INTRO OVERLAY -->
    <div id="introOverlay" class="intro-overlay" aria-label="Intro">

      <!-- Poster stack as IMG tags (no CSS path confusion) -->
      <div class="intro-bg-stack" aria-hidden="true">
        <img class="bg-img bg1" src="assets/ui/backgrounds/backrooms_variant_1.webp" alt="">
        <img class="bg-img bg2" src="assets/ui/backgrounds/backrooms_variant_2.webp" alt="">
        <img class="bg-img bg3" src="assets/ui/backgrounds/backrooms_variant_3.webp" alt="">

        <div id="flash" class="flash"></div>
      </div>

      <!-- Button only (NO injected title, NO injected instruction text) -->
      <button id="introStartBtn" class="intro-start-btn" type="button">
        TAP TO BEGIN
      </button>
    </div>

  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
