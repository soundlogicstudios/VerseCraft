<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Backrooms Branching</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <main class="app">

    <!-- APP BACKGROUND (behind everything) -->
    <div class="app-background" aria-hidden="true"></div>

    <!-- VIDEO STAGE -->
    <section class="stage" aria-label="Video Stage">
      <video id="video" class="video" playsinline preload="metadata"></video>

      <!-- DIMMER (used during choices) -->
      <div id="dimmer" class="dimmer" aria-hidden="true"></div>

      <!-- FRAME OVERLAY -->
      <img
        src="assets/ui/frames/video_frame_overlay.webp"
        class="frame-overlay"
        alt=""
        aria-hidden="true"
      />

      <!-- CHOICES -->
      <div id="choices" class="choices hidden" aria-label="Choices"></div>

      <!-- MODAL (errors etc) -->
      <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true">
        <div class="modal-panel" role="dialog" aria-modal="true">
          <div id="modalContent" class="modal-content"></div>
          <button id="modalClose" class="modal-close" type="button">Close</button>
        </div>
      </div>

      <!-- STATUS (debug) -->
      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <!-- INTRO OVERLAY (flicker + poster + tap to begin) -->
    <div id="introOverlay" class="intro-overlay" aria-label="Intro">
      <div class="intro-bg-stack" aria-hidden="true">
        <div class="bg-layer bg1"></div>
        <div class="bg-layer bg2"></div>
        <div class="bg-layer bg3"></div>

        <!-- brief white flash -->
        <div id="flash" class="flash"></div>

        <!-- subtle scanlines for fluorescent vibe -->
        <div class="scanlines"></div>
      </div>

      <div class="intro-modal">
        <img
          src="assets/ui/modals/modal_panel.webp"
          class="intro-panel"
          alt=""
          aria-hidden="true"
        />

        <div class="intro-title">THE BACKROOMS</div>
        <div class="intro-subtitle">Tap required to begin</div>

        <button id="introStartBtn" class="intro-start-btn" type="button">
          TAP TO BEGIN
        </button>
      </div>
    </div>

  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
