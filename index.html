<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Backrooms Branching</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <main class="app">

    <!-- VIDEO STAGE -->
    <section class="stage" aria-label="Video Stage">
      <video id="video" class="video" playsinline preload="metadata"></video>

      <!-- FRAME OVERLAY -->
      <img
        src="assets/ui/frames/video_frame_overlay.webp"
        class="frame-overlay"
        alt=""
        aria-hidden="true"
      />

      <!-- CHOICES -->
      <div id="choices" class="choices hidden"></div>

      <!-- STATUS -->
      <div id="status" class="status"></div>
    </section>

    <!-- INTRO OVERLAY -->
    <div id="introOverlay" class="intro-overlay">

      <div class="intro-bg-stack">
        <div class="bg-layer bg1"></div>
        <div class="bg-layer bg2"></div>
        <div class="bg-layer bg3"></div>

        <!-- white flash -->
        <div id="flash" class="flash"></div>
      </div>

      <div class="intro-modal">
        <img
          src="assets/ui/modals/modal_panel.webp"
          class="intro-panel"
          alt=""
        />

        <div class="intro-title">THE BACKROOMS</div>

        <button id="introStartBtn" class="intro-start-btn">
          TAP TO BEGIN
        </button>
      </div>

    </div>

  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
