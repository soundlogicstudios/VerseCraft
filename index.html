<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Branching App</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <main id="app" class="app">
    <section class="stage" aria-label="Video Stage">
      <video id="video" class="video" playsinline preload="metadata"></video>

      <!-- Tap-to-play overlay (iOS gesture requirement) -->
      <button id="tapToPlay" class="tap-to-play" type="button">TAP TO PLAY</button>

      <!-- Choices -->
      <div id="choices" class="choices hidden" aria-label="Choices"></div>

      <!-- Debug / status -->
      <div id="status" class="status" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
